# Canonical caller — every knob lives in /hanzo.yml, none here.
# Runs on the git-runner fleet at git.hanzo.ai, the only pool serving these
# labels. github.com resolves only .github/workflows and has no runner for
# them, so a caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    # Pinned ahead of the `v1` alias. Publishing a release asset off github.com
    # takes both a credential the listening forge issued and an upload address
    # that forge answers on; v1.0.69 is the first tag with both. This repo is the
    # first to publish an asset anywhere, so it proves the tag before the alias
    # moves and every other repo follows it.
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1.0.69
    secrets: inherit
