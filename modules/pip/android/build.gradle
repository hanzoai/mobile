plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.hanzo.mobile'
version = '0.1.0'

android {
  namespace "ai.hanzo.mobile.pip"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Declared rather than inherited: the module compiles against the
  // ComponentActivity listener API (PiP mode change, user-leave hint),
  // which needs androidx.activity 1.6 or newer on its own classpath.
  implementation 'androidx.activity:activity-ktx:1.10.1'
}
