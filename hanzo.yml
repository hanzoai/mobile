# Canonical CI for hanzoai/mobile — the Expo/React Native client.
#
# No `images:`, no `deploy:` and no `binaries:`: a phone installs this, no cluster
# runs it. The artifact is an APK, published by .github/workflows/release.yml on
# a `v*` tag — not by hanzoai/ci's `binaries:` lane, which would create the same
# release on the same tag and race it. One publisher.

test:
  - name: typecheck
    # tsc is the build for this repo — there is no bundle step in CI, so a type
    # error is the earliest honest signal that the app is broken.
    run: |
      set -e
      corepack enable
      pnpm install --frozen-lockfile
      pnpm typecheck

  - name: test
    # Jest. Runs after typecheck so a red here means logic, not types.
    run: |
      set -e
      corepack enable
      pnpm install --frozen-lockfile
      pnpm test
