# Release the Android APK and unsigned iOS IPA.
#
# A `v*` tag builds both native release packages in parallel (`apk` on
# heavy-linux-amd64, `ipa` on GitHub-hosted macos-15) and `publish` atomically
# attaches all five assets to that tag's GitHub release:
#   - hanzo-android-v<version>.apk  (matched by hanzo-inc/app sync-releases)
#   - hanzo-android.apk             (stable direct link on hanzo.ai/download & docs)
#   - hanzo-ios-v<version>.ipa      (unsigned Release iOS bundle)
#   - hanzo-ios.ipa                 (stable direct link for AltServer-Linux / SideStore / zsign)
#   - SHA256SUMS.txt
#
# A pull request that touches this file is the DRY RUN: the same builds run,
# `publish` uploads to a DRAFT release named dry-run-pr<N> (invisible to readers
# and to releases/latest), checks every asset, and deletes the draft whether or
# not anything failed.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

# Serialised, never cancelled: a cancelled run's cleanup would delete the draft a
# newer run of the same PR had already reused.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apk:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # `heavy-` is a class the platform scheduler reads (6 CPU, 24Gi, 80Gi disk);
    # the `-amd64` suffix is what the runner fleet serves.
    runs-on: [heavy-linux-amd64]
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4

      # The tag is the version of record: the APK reports app.json's version, so
      # a tag that disagrees would ship a build whose name lies about it. A
      # pull request has no tag; it builds whatever app.json says.
      - name: Version of record
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          app=$(jq -r '.expo.version // empty' app.json)
          [ -n "$app" ] || { echo "::error::app.json has no expo.version"; exit 1; }
          if [ -n "$TAG" ] && [ "$TAG" != "v$app" ]; then
            echo "::error::tag $TAG disagrees with app.json expo.version $app. The tag is the version of record: set expo.version to ${TAG#v} and retag."
            exit 1
          fi
          printf '%s' "$app" | grep -Eq '^[0-9]+(\.[0-9]+)*$' \
            || { echo "::error::version $app is not digits and dots, so hanzo-android-v$app.apk would not match the download page"; exit 1; }
          echo "VERSION=$app" >> "$GITHUB_ENV"
          echo "version of record: $app (${TAG:-no tag, dry run})"

      - name: Install dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH"
          pnpm install --frozen-lockfile

      # The runner has a JDK and no Android SDK, no sudo and no apt, so the
      # SDK's command-line tools come into RUNNER_TEMP. Gradle fetches the
      # platform, build-tools and NDK itself once the licences are accepted.
      - name: Android toolchain
        run: |
          set -euo pipefail
          command -v javac >/dev/null || { echo "::error::the runner image has no JDK"; exit 1; }
          ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo "2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  $RUNNER_TEMP/tools.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          [ -s "$ANDROID_HOME/licenses/android-sdk-license" ] \
            || { echo "::error::android-sdk-license was not accepted"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "toolchain: node $(node -v), $(java -version 2>&1 | head -1), sdk $ANDROID_HOME"

      - name: Prebuild
        run: |
          set -euo pipefail
          PATH="$RUNNER_TEMP/bin:$PATH"
          npx expo prebuild --platform android --no-install

      # Bounded heap and workers: the pod's cgroup limit is not what gradle and
      # the compilers read, they read the node's cores.
      - name: Gradle assembleRelease
        run: |
          set -euo pipefail
          ./android/gradlew -p android --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx3g assembleRelease

      - name: Check the APK
        run: |
          set -euo pipefail
          apks=(android/app/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -eq 1 ] && [ -f "${apks[0]}" ] \
            || { echo "::error::expected one release APK, found: ${apks[*]}"; exit 1; }
          mkdir -p dist
          APK="dist/hanzo-android-v$VERSION.apk"
          cp "${apks[0]}" "$APK"
          unzip -l "$APK" | sed -n '1,4p;$p'
          python3 -I - "$APK" <<'EOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          bad = z.testzip()
          if bad:
              sys.exit(f"corrupt entry {bad}")
          if "AndroidManifest.xml" not in z.namelist():
              sys.exit("no AndroidManifest.xml")
          m = z.read("AndroidManifest.xml")
          pkg = "ai.hanzo.mobile"
          if pkg.encode("utf-16-le") not in m and pkg.encode() not in m:
              sys.exit(f"manifest does not name {pkg}")
          print(f"zip ok, {len(z.namelist())} entries, manifest names {pkg}")
          EOF
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -n "$aapt2" ]; then
            badging=$("$aapt2" dump badging "$APK" | sed -n 1p)
            echo "$badging"
            case "$badging" in
              "package: name='ai.hanzo.mobile'"*"versionName='$VERSION'"*) ;;
              *) echo "::error::APK is not ai.hanzo.mobile $VERSION"; exit 1 ;;
            esac
          else
            echo "::notice::no aapt2 under $ANDROID_HOME/build-tools; manifest checked by string pool only"
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$apksigner" ]; then "$apksigner" verify --print-certs "$APK" | sed -n 1,2p; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/hanzo-android-v*.apk
          if-no-files-found: error
          retention-days: 5

  ipa:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Version of record
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          app=$(jq -r '.expo.version // empty' app.json)
          [ -n "$app" ] || { echo "::error::app.json has no expo.version"; exit 1; }
          if [ -n "$TAG" ] && [ "$TAG" != "v$app" ]; then
            echo "::error::tag $TAG disagrees with app.json expo.version $app. The tag is the version of record: set expo.version to ${TAG#v} and retag."
            exit 1
          fi
          printf '%s' "$app" | grep -Eq '^[0-9]+(\.[0-9]+)*$' \
            || { echo "::error::version $app is not digits and dots"; exit 1; }
          echo "VERSION=$app" >> "$GITHUB_ENV"
          echo "version of record: $app (${TAG:-no tag, dry run})"

      - name: Select Xcode
        run: |
          set -euo pipefail
          # app.json uses ./assets/expo.icon (Xcode 26 Icon Composer bundle);
          # macos-15 provides Xcode 26 alongside Xcode 16.4.
          latest_xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest_xcode" ] && [ -d "$latest_xcode/Contents/Developer" ]; then
            sudo xcode-select -s "$latest_xcode/Contents/Developer"
          fi
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH"
          pnpm install --frozen-lockfile

      # HANZO_IOS_PERSONAL_TEAM=1 builds a single-target Hanzo.app without App
      # Group / WidgetKit extension entitlements, so sideloaders (AltServer-Linux,
      # SideStore, zsign + ideviceinstaller) can re-sign it with a free Apple ID.
      - name: Prebuild iOS
        run: |
          set -euo pipefail
          HANZO_IOS_PERSONAL_TEAM=1 npx expo prebuild --platform ios --no-install
          printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > ios/.xcode.env.local

      - name: CocoaPods install
        run: |
          set -euo pipefail
          command -v pod >/dev/null || brew install cocoapods
          pod install --project-directory=ios || pod install --project-directory=ios --repo-update

      - name: Build unsigned Release .app
        run: |
          set -euo pipefail
          workspaces=(ios/*.xcworkspace)
          [ "${#workspaces[@]}" -eq 1 ] && [ -d "${workspaces[0]}" ] \
            || { echo "::error::expected one ios/*.xcworkspace, found: ${workspaces[*]}"; exit 1; }
          WORKSPACE="${workspaces[0]}"
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" \
            | jq -r '.workspace.schemes | map(select(. != "Pods" and (startswith("Pods-") | not))) | if index("Hanzo") then "Hanzo" else .[0] // empty end')
          [ -n "$SCHEME" ] || { echo "::error::no app scheme found in $WORKSPACE"; exit 1; }
          echo "building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package and check the IPA
        run: |
          set -euo pipefail
          apps=("$RUNNER_TEMP"/ios-build/Build/Products/Release-iphoneos/*.app)
          [ "${#apps[@]}" -eq 1 ] && [ -d "${apps[0]}" ] \
            || { echo "::error::expected one Release-iphoneos .app, found: ${apps[*]}"; exit 1; }
          APP_PATH="${apps[0]}"
          APP_NAME=$(basename "$APP_PATH")
          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload" dist
          cp -R "$APP_PATH" "$STAGE/Payload/"
          IPA="dist/hanzo-ios-v$VERSION.ipa"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/$IPA" Payload)
          unzip -l "$IPA" | sed -n '1,6p;$p'
          python3 - "$IPA" "$APP_NAME" "$VERSION" <<'EOF'
          import plistlib, sys, zipfile
          ipa_path, app_name, expected_version = sys.argv[1], sys.argv[2], sys.argv[3]
          z = zipfile.ZipFile(ipa_path)
          bad = z.testzip()
          if bad:
              sys.exit(f"corrupt zip entry {bad}")
          names = set(z.namelist())
          info_key = f"Payload/{app_name}/Info.plist"
          if info_key not in names:
              sys.exit(f"missing {info_key} in IPA")
          info = plistlib.loads(z.read(info_key))
          bundle_id = info.get("CFBundleIdentifier")
          short_ver = info.get("CFBundleShortVersionString")
          exe = info.get("CFBundleExecutable")
          if bundle_id != "ai.hanzo.mobile":
              sys.exit(f"expected CFBundleIdentifier ai.hanzo.mobile, got {bundle_id}")
          if short_ver != expected_version:
              sys.exit(f"expected CFBundleShortVersionString {expected_version}, got {short_ver}")
          exe_key = f"Payload/{app_name}/{exe}"
          if not exe or exe_key not in names:
              sys.exit(f"missing executable {exe_key} in IPA")
          bundle_js = f"Payload/{app_name}/main.jsbundle"
          if bundle_js not in names:
              sys.exit(f"missing embedded JS bundle {bundle_js} in IPA")
          print(f"ipa ok: {len(names)} entries, {bundle_id} {short_ver}, executable={exe}, main.jsbundle present")
          EOF

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/hanzo-ios-v*.ipa
          if-no-files-found: error
          retention-days: 5

  publish:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [apk, ipa]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('dry-run-pr{0}', github.event.pull_request.number) }}
      DRAFT: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Release helpers
        run: |
          cat > "$RUNNER_TEMP/release-api.sh" <<'EOF'
          API="${GITHUB_API_URL:-https://api.github.com}"
          R="$API/repos/$GITHUB_REPOSITORY"
          api() {
            local out status
            out=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$@")
            status=${out##*$'\n'}
            case "$status" in 2*) printf '%s' "${out%$'\n'*}"; return 0 ;; esac
            printf 'refused: %s %s\n%s\n' "$status" "$*" "$(printf '%s' "${out%$'\n'*}" | head -c 400)" >&2
            return 1
          }
          find_release() {
            local page=1 body hit
            while :; do
              body=$(api "$R/releases?per_page=100&page=$page") || return 1
              [ "$(jq length <<<"$body")" -gt 0 ] || return 0
              hit=$(jq -c --arg t "$1" '[.[] | select(.tag_name == $t)][0] // empty' <<<"$body")
              if [ -n "$hit" ]; then printf '%s' "$hit"; return 0; fi
              page=$((page + 1))
            done
          }
          EOF

      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist

      - name: Prepare stable aliases and SHA256SUMS.txt
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.expo.version' app.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp "dist/hanzo-android-v$VERSION.apk" "dist/hanzo-android.apk"
          cp "dist/hanzo-ios-v$VERSION.ipa" "dist/hanzo-ios.ipa"
          (
            cd dist
            sha256sum \
              "hanzo-android-v$VERSION.apk" \
              "hanzo-android.apk" \
              "hanzo-ios-v$VERSION.ipa" \
              "hanzo-ios.ipa" > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release-api.sh"
          rel=$(find_release "$RELEASE_TAG")
          if [ -z "$rel" ]; then
            rel=$(api -X POST -H 'Content-Type: application/json' "$R/releases" -d "$(jq -nc \
              --arg t "$RELEASE_TAG" --arg c "$TARGET" --argjson d "$DRAFT" \
              --arg n "Hanzo Mobile $RELEASE_TAG (Android APK & iOS IPA)" \
              '{tag_name: $t, target_commitish: $c, name: $n, draft: $d, prerelease: false, make_latest: (if $d then "false" else "true" end), generate_release_notes: ($d | not)}')") \
              || rel=$(find_release "$RELEASE_TAG")
          elif [ "$DRAFT" = "false" ]; then
            rel=$(api -X PATCH -H 'Content-Type: application/json' "$R/releases/$(jq -r .id <<<"$rel")" -d \
              '{"draft":false,"prerelease":false,"make_latest":"true"}')
          fi
          [ -n "$rel" ] || { echo "::error::could not find or create release $RELEASE_TAG"; exit 1; }
          id=$(jq -r .id <<<"$rel")
          up=$(jq -r '.upload_url | sub("\\{.*$"; "")' <<<"$rel")
          echo "release $RELEASE_TAG id=$id draft=$(jq -r .draft <<<"$rel")"

          FILES=(
            "dist/hanzo-android-v$VERSION.apk"
            "dist/hanzo-android.apk"
            "dist/hanzo-ios-v$VERSION.ipa"
            "dist/hanzo-ios.ipa"
            "dist/SHA256SUMS.txt"
          )

          existing=$(api "$R/releases/$id/assets?per_page=100")
          for path in "${FILES[@]}"; do
            name=$(basename "$path")
            for old in $(jq -r --arg n "$name" '.[] | select(.name == $n) | .id' <<<"$existing"); do
              api -X DELETE "$R/releases/assets/$old" >/dev/null
            done
            case "$name" in
              *.apk) ctype='application/vnd.android.package-archive' ;;
              *.ipa) ctype='application/octet-stream' ;;
              *)     ctype='text/plain; charset=utf-8' ;;
            esac
            api -X POST -H "Content-Type: $ctype" --data-binary @"$path" "$up?name=$name" >/dev/null
          done

          assets=$(api "$R/releases/$id/assets?per_page=100")
          jq -r '.[] | "asset \(.name)  \(.size) bytes  \(.state)"' <<<"$assets"
          for path in "${FILES[@]}"; do
            name=$(basename "$path")
            got=$(jq -r --arg n "$name" '.[] | select(.name == $n) | "\(.size) \(.state)"' <<<"$assets")
            [ "$got" = "$(stat -c %s "$path") uploaded" ] \
              || { echo "::error::$name is not on release $RELEASE_TAG intact (saw: ${got:-absent})"; exit 1; }
          done
          jq -r '.[].name' <<<"$assets" | grep -Eq '^hanzo-android-v[0-9.]+\.apk$' \
            || { echo "::error::no versioned APK matches download page pattern"; exit 1; }
          jq -r '.[].name' <<<"$assets" | grep -Eq '^hanzo-ios-v[0-9.]+\.ipa$' \
            || { echo "::error::no versioned IPA on release"; exit 1; }
          {
            echo "### Release \`$RELEASE_TAG\`"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the dry-run draft
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release-api.sh"
          rel=$(find_release "$RELEASE_TAG")
          if [ -n "$rel" ]; then
            [ "$(jq -r .draft <<<"$rel")" = true ] \
              || { echo "::error::release $RELEASE_TAG is not a draft; refusing to delete it"; exit 1; }
            api -X DELETE "$R/releases/$(jq -r .id <<<"$rel")" >/dev/null
          fi
          [ -z "$(find_release "$RELEASE_TAG")" ] || { echo "::error::draft $RELEASE_TAG is still there"; exit 1; }
          if api "$R/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::the dry run left a git tag $RELEASE_TAG"; exit 1
          fi
          echo "draft $RELEASE_TAG deleted, no tag left behind"
